schema_version: 1

context:
  version: "3.13.0"
  build_number: 1

recipe:
  name: google-cloud-cpp-core
  version: ${{ version }}

source:
  url: https://github.com/googleapis/google-cloud-cpp/archive/v${{ version }}.tar.gz
  sha256: 3fefa2ca821ec8dd26f2d5ffc89611e74259c76a459fce3fd3cf46013785e423
  patches:
    - patches/0001-Adapt-for-OpenTelemetry-1.25.patch

build:
  number: ${{ build_number }}

outputs:
  # Runs build.sh once and shares the resulting build tree with all package
  # outputs below, which each install their own subset of the build.
  - staging:
      name: google-cloud-cpp-core-staging
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
        - libgrpc
        - libprotobuf
      host:
        - libabseil
        - libcrc32c
        - libcurl
        - libgrpc
        - libprotobuf
        - libopentelemetry-cpp
        - if: unix
          then: openssl
        - nlohmann_json
        - zlib

  - package:
      name: libgoogle-cloud
    inherit: google-cloud-cpp-core-staging
    build:
      script:
        file: install-libgoogle-cloud
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
        - libgrpc
        - libprotobuf
      host:
        - libabseil
        - libcurl
        - libgrpc
        - libprotobuf
        - if: unix
          then: openssl
        - nlohmann_json
        - libopentelemetry-cpp
        - if: osx
          then: libcxx
      run:
        - if: osx
          then: libcxx
      run_exports:
        - ${{ pin_subpackage("libgoogle-cloud", upper_bound="x.x") }}
      run_constraints:
        - libgoogle-cloud ==${{ version }} *_${{ build_number }}
    tests:
      - package_contents:
          # using a sample library as stand-in for many
          files:
            exists:
              # presence of versioned shared library (unix)
              - if: linux
                then: lib/libgoogle_cloud_cpp_common.so.${{ version }}
              - if: osx
                then: lib/libgoogle_cloud_cpp_common.${{ version }}.dylib
            not_exists:
              # components that belong in the devel package
              - if: unix
                then:
                  # absence of headers
                  - include/google/cloud/version.h
                  # absence of static library
                  - lib/libgoogle_cloud_cpp_common.a
                  # absence of unversioned shared library
                  - lib/libgoogle_cloud_cpp_common.so
                  - lib/libgoogle_cloud_cpp_common.dylib
                  # absence of metadata for CMake & pkgconfig
                  - lib/cmake/google_cloud_cpp_common/google_cloud_cpp_common-config.cmake
                  - lib/pkgconfig/google_cloud_cpp_common.pc
                else:
                  - Library/include/google/cloud/version.h
                  - Library/lib/google_cloud_cpp_common.lib
                  - Library/lib/cmake/google_cloud_cpp_common/google_cloud_cpp_common-config.cmake
                  - Library/lib/pkgconfig/google_cloud_cpp_common.pc

  - package:
      name: libgoogle-cloud-devel
    inherit: google-cloud-cpp-core-staging
    build:
      script:
        file: install-libgoogle-cloud
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
        - libgrpc
        - libprotobuf
        - if: build_platform != target_platform
          then:
            - libcurl
            - openssl
      host:
        - ${{ pin_subpackage("libgoogle-cloud", exact=True) }}
        - libabseil
        - libcurl
        - libgrpc
        - libprotobuf
        - if: unix
          then: openssl
        - nlohmann_json
        - libopentelemetry-cpp
      run:
        - ${{ pin_subpackage("libgoogle-cloud", exact=True) }}
        - libabseil
        - libcurl
        - libgrpc
        - libprotobuf
        - if: unix
          then: openssl
        - nlohmann_json
        # cannot load package without zlib because it's specified
        # as required; if possible, this should be removed upstream
        - zlib
        - if: osx
          then: libcxx
      run_exports:
        - ${{ pin_subpackage("libgoogle-cloud", upper_bound="x.x") }}
    tests:
      - package_contents:
          include:
            - google/cloud/version.h
          # using a sample library as stand-in for many
          lib:
            # windows only has static libs
            - if: unix
              then: google_cloud_cpp_common
          files:
            - if: unix
              then:
                - lib/cmake/google_cloud_cpp_common/google_cloud_cpp_common-config.cmake
                - lib/pkgconfig/google_cloud_cpp_common.pc
              else:
                - Library/lib/google_cloud_cpp_common.lib
                - Library/lib/cmake/google_cloud_cpp_common/google_cloud_cpp_common-config.cmake
                - Library/lib/pkgconfig/google_cloud_cpp_common.pc
      - files:
          recipe:
            - run_test_common.sh
            - run_test_common.bat
            - tests/CMakeLists.txt
            - tests/quickstart.cc
        requirements:
          run:
            - ${{ compiler('cxx') }}
            - cmake
            - ninja
        script:
          - if: unix
            then: ./run_test_common.sh
            else: ./run_test_common.bat

